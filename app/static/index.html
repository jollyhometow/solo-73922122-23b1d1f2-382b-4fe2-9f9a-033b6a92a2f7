<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>取证证据接收系统</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-page="home">
  <header class="topbar">
    <div class="brand">🛡️ 取证证据接收系统</div>
    <nav>
      <a href="/" class="active">首页 / 已发布版本</a>
      <a href="/intake">证据接收页</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>已发布版本清单</h2>
      <p class="hint">每个案件的已发布版本不可变；新版本不会改变旧版内容，附件仅作下载。</p>
      <table id="cases-table">
        <thead>
          <tr>
            <th>案件号</th>
            <th>当前版本</th>
            <th>当前版文件数</th>
            <th>当前版总大小</th>
            <th>最近更新 (UTC)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="cases-empty" class="hint" hidden>暂无已发布案件，前往「证据接收页」提交第一个取证包。</p>
    </section>

    <section class="card" id="detail-card" hidden>
      <h2 id="detail-title"></h2>
      <div id="detail-body"></div>
      <p><a href="/" class="btn-link">← 返回清单</a></p>
    </section>

    <section class="card">
      <h2>演示样例</h2>
      <p class="hint">
        下载样例 ZIP 与独立 JSON 清单后，到
        <a href="/intake">证据接收页</a> 上传。建议案件号分别使用
        <code>DEMO-BENIGN</code>、<code>DEMO-EVIL</code>、<code>DEMO-TAMPER</code>，
        首次提交“预期当前版本”填 <code>0</code>。
      </p>
      <div id="samples" class="samples"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>

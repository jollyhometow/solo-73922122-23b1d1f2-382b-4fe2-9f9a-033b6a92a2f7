services:
  evidence-intake:
    build: .
    image: evidence-intake:1.0.0
    container_name: evidence-intake
    ports:
      - "8000:8000"
    environment:
      # 两个 gunicorn worker 进程共享该目录（SQLite + 文件存储）。
      EVIDENCE_HOME: /data
    volumes:
      - evidence-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  evidence-data:
